name: mutualruleta

services:
  app:
    image: node:22-alpine
    restart: unless-stopped
    command: ["sh", "-c", "rm -rf /app && mkdir -p /app && base64 -d /bundle.b64 | tar xz -C /app && exec node /app/mutualruleta/server.js"]
    environment:
      PORT: "3000"
      DATA_DIR: /data
      NODE_ENV: production
      NODE_NO_WARNINGS: "1"
      ADMIN_USER: ${ADMIN_USER:-Pamela}
      ADMIN_PASS: ${ADMIN_PASS}
    configs:
      - source: bundle
        target: /bundle.b64
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.mutualruleta.rule=Host(`mutualruleta.miapp-gymbro.tech`)
      - traefik.http.routers.mutualruleta.entrypoints=websecure
      - traefik.http.routers.mutualruleta.tls.certresolver=letsencrypt
      - traefik.http.services.mutualruleta.loadbalancer.server.port=3000

